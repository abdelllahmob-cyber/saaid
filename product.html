<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>تفاصيل المنتج</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --primary:#1a6b8a;--primary-dark:#124f68;--primary-light:#e8f4f8;
  --accent:#00b4d8;--accent2:#d4af37;
  --text:#1e2a38;--text-light:#5a6a7a;
  --white:#fff;--bg:#f7fbfd;--card-bg:#fff;--border:#dde8ee;
  --whatsapp:#25d366;--whatsapp-dark:#128c7e;
  --shadow:0 4px 24px rgba(26,107,138,.10);--shadow-lg:0 8px 48px rgba(26,107,138,.18);
  --radius:16px;--radius-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:300;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);box-shadow:var(--shadow);padding:0 16px}
.nav-inner{max-width:1100px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.back-btn{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--primary);font-size:14px;font-weight:700;padding:8px 14px;border-radius:22px;background:var(--primary-light);transition:all .2s;flex-shrink:0}
.back-btn:hover{background:var(--primary);color:#fff}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex:1;justify-content:center}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.logo-text .brand{font-size:14px;font-weight:900;color:var(--primary-dark)}
.lang-btn{background:var(--primary-light);border:1.5px solid var(--border);color:var(--primary);padding:7px 12px;border-radius:20px;font-family:'Cairo',sans-serif;font-size:12.5px;font-weight:800;cursor:pointer;flex-shrink:0;transition:.2s}
.lang-btn:hover{background:var(--primary);color:#fff}

/* PAGE */
.page{padding-top:60px;padding-bottom:120px}

/* BREADCRUMB */
.breadcrumb{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-light)}
.breadcrumb a{color:var(--primary);text-decoration:none;font-weight:600}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb span{color:var(--text-light)}

/* PRODUCT LAYOUT */
.product-layout{max-width:1000px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}

/* GALLERY SIDE */
.gallery-side{}
.main-img-wrap{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--primary-light);aspect-ratio:1/1;box-shadow:var(--shadow-lg)}
.main-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .3s}
.g-ph-full{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--primary-light),#cce6ef);color:var(--primary)}
.g-ph-full i{font-size:64px;margin-bottom:12px;opacity:.6}
.g-ph-full span{font-size:15px;font-weight:700;opacity:.75}

/* Gallery nav arrows */
.g-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--primary);box-shadow:0 2px 12px rgba(0,0,0,.15);transition:all .2s}
.g-arrow:hover{background:var(--primary);color:#fff}
.g-arrow-prev{right:12px}
.g-arrow-next{left:12px}

/* Thumbnails */
.thumbs-row{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.thumbs-row::-webkit-scrollbar{display:none}
.thumb{width:68px;height:68px;border-radius:10px;overflow:hidden;flex-shrink:0;cursor:pointer;border:2.5px solid transparent;transition:all .2s;box-shadow:var(--shadow)}
.thumb.active{border-color:var(--primary);transform:scale(1.06)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-ph{width:100%;height:100%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--primary);opacity:.6}

/* Badge strip */
.badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bdg{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
.bdg-blue{background:var(--primary-light);color:var(--primary)}
.bdg-green{background:#e8f8ef;color:#166534}
.bdg-gold{background:#fff8e1;color:#8a6800}

/* INFO SIDE */
.info-side{}
.prod-title{font-size:22px;font-weight:900;color:var(--text);line-height:1.3;margin-bottom:8px}
.prod-sub{font-size:14px;color:var(--text-light);margin-bottom:18px;line-height:1.5}

.rating-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.stars-big{color:#f0b429;font-size:18px}
.rating-count{font-size:13px;color:var(--text-light);font-weight:600}

.price-box{background:linear-gradient(135deg,var(--primary-light),#fff);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:18px}
.price-main{font-size:38px;font-weight:900;color:var(--primary);line-height:1}
.price-main small{font-size:16px;font-weight:600;color:var(--text-light)}
.price-note{font-size:12px;color:var(--whatsapp);font-weight:700;margin-top:6px;display:flex;align-items:center;gap:5px}

/* Color picker */
.color-sec{margin-bottom:18px}
.color-heading{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px}
.color-heading b{color:var(--primary);font-size:15px}
.color-dots{display:flex;gap:10px;flex-wrap:wrap}
.cdot{width:38px;height:38px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cdot.active{border-color:var(--primary);box-shadow:0 0 0 2px #fff,0 0 0 4.5px var(--primary);transform:scale(1.12)}
.cdot:hover{transform:scale(1.15)}

/* Description */
.desc-sec{margin-bottom:20px}
.desc-sec h3{font-size:15px;font-weight:800;color:var(--primary-dark);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.desc-text{font-size:13.5px;color:var(--text);line-height:1.85;margin-bottom:10px}
.feat-list{background:#eef9f1;border-radius:10px;padding:13px 15px;margin:12px 0;border-right:3px solid #22c55e}
.feat-list p{margin-bottom:6px;font-size:13px}
.feat-list p:last-child{margin-bottom:0}

/* FAQ */
.faq-sec{margin-bottom:20px}
.faq-sec h3{font-size:15px;font-weight:800;color:var(--primary-dark);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.faq-item{background:var(--primary-light);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.faq-q{font-size:13px;font-weight:800;color:var(--primary);margin-bottom:6px}
.faq-a{font-size:12.5px;color:var(--text-light);line-height:1.6}

/* CTA Buttons */
.cta-group{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.order-btn-lg{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:linear-gradient(135deg,var(--whatsapp),var(--whatsapp-dark));color:#fff;text-decoration:none;border:none;border-radius:var(--radius-sm);font-family:'Cairo',sans-serif;font-size:16px;font-weight:900;box-shadow:0 4px 18px rgba(37,211,102,.38);transition:all .25s;cursor:pointer}
.order-btn-lg:hover{transform:translateY(-3px);box-shadow:0 7px 24px rgba(37,211,102,.5)}
.share-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:transparent;border:1.5px solid var(--border);color:var(--text-light);border-radius:var(--radius-sm);font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.share-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}

/* Delivery info */
.delivery-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.del-item{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;text-align:center}
.del-icon{font-size:18px;margin-bottom:4px}
.del-txt{font-size:11px;font-weight:700;color:var(--text)}

/* STICKY ORDER (mobile) */
.sticky-order{position:fixed;bottom:0;left:0;right:0;z-index:400;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:12px 16px;box-shadow:0 -4px 20px rgba(26,107,138,.12);display:none}
.sticky-order a{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:14px;background:linear-gradient(135deg,var(--whatsapp),var(--whatsapp-dark));color:#fff;text-decoration:none;border-radius:var(--radius-sm);font-family:'Cairo',sans-serif;font-size:15px;font-weight:900;box-shadow:0 4px 16px rgba(37,211,102,.35)}

/* FLOAT WA */
.wa-float{position:fixed;bottom:80px;left:18px;z-index:999}
.wa-float a{display:flex;align-items:center;justify-content:center;width:52px;height:52px;background:linear-gradient(135deg,var(--whatsapp),var(--whatsapp-dark));color:#fff;border-radius:50%;text-decoration:none;box-shadow:0 4px 20px rgba(37,211,102,.48);animation:waPulse 2.2s infinite;transition:transform .25s}
.wa-float a:hover{transform:scale(1.1)}
.wa-float a svg{width:24px;height:24px;fill:#fff}
.wa-tooltip{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:5px 10px;border-radius:7px;font-size:11.5px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s}
.wa-float:hover .wa-tooltip{opacity:1}
@keyframes waPulse{0%,100%{box-shadow:0 4px 20px rgba(37,211,102,.48)}50%{box-shadow:0 4px 32px rgba(37,211,102,.75)}}

/* LTR */
html[dir="ltr"] .feat-list{border-right:none;border-left:3px solid #22c55e}
html[dir="ltr"] .g-arrow-prev{right:auto;left:12px}
html[dir="ltr"] .g-arrow-next{left:auto;right:12px}

/* RESPONSIVE */
@media(max-width:720px){
  .product-layout{grid-template-columns:1fr}
  .sticky-order{display:block}
  .wa-float{bottom:85px}
}
@media(max-width:420px){
  .prod-title{font-size:18px}
  .price-main{font-size:30px}
}
</style>
</head>

/* ═══ STATE ═══ */
let currentLang=localStorage.getItem('lang')||'ar';
let productId=1;
let currentColor=0;
let currentImgIdx=0;

/* ═══ INIT ═══ */
function init(){
  const params=new URLSearchParams(location.search);
  productId=parseInt(params.get('id'))||1;
  if(!PRODUCTS[productId]) productId=1;
  buildPage();
  applyLang(currentLang);
}

function buildPage(){
  const prod=PRODUCTS[productId];
  const lang=currentLang;

  document.title=(prod.name[lang]||prod.name.ar)+' — متجر الرفوف';
  document.getElementById('breadProd').textContent=prod.name[lang]||prod.name.ar;
  document.getElementById('prodTitle').textContent=prod.name[lang]||prod.name.ar;
  document.getElementById('prodSub').textContent=prod.sub[lang]||prod.sub.ar;
  document.getElementById('prodPrice').innerHTML=prod.price+'<small style="font-size:16px;color:var(--text-light);font-weight:600"> '+(lang==='ar'?'درهم':'Dh')+'</small>';

  buildColorDots();
  selectColor(0);
  buildDesc();
  buildFaq();
}

function buildColorDots(){
  const prod=PRODUCTS[productId];
  const wrap=document.getElementById('colorDots');
  wrap.innerHTML='';
  prod.colors.forEach((c,i)=>{
    const b=document.createElement('button');
    b.type='button';b.className='cdot'+(i===0?' active':'');
    b.style.background=c.h;
    if(c.h==='#F0EDE8') b.style.outline='1.5px solid #ccc';
    b.onclick=()=>selectColor(i);
    wrap.appendChild(b);
  });
}

function selectColor(ci){
  currentColor=ci;currentImgIdx=0;
  const prod=PRODUCTS[productId];const c=prod.colors[ci];
  document.querySelectorAll('#colorDots .cdot').forEach((d,i)=>d.classList.toggle('active',i===ci));
  document.getElementById('colorName').textContent=c[currentLang]||c.ar;
  buildThumbs(ci);
  setMainImg(c.imgs[0]);
  updateOrderLinks(ci);
}

function buildThumbs(ci){
  const imgs=PRODUCTS[productId].colors[ci].imgs;
  const wrap=document.getElementById('thumbsRow');
  wrap.innerHTML='';
  imgs.forEach((src,i)=>{
    const d=document.createElement('div');
    d.className='thumb'+(i===0?' active':'');
    d.onclick=()=>{currentImgIdx=i;selectThumb(i,ci)};
    const img=document.createElement('img');
    img.src=src;img.alt='';
    img.onerror=function(){this.parentNode.innerHTML='<div class="thumb-ph"><i class="fa-solid fa-image"></i></div>'};
    d.appendChild(img);wrap.appendChild(d);
  });
}

function selectThumb(ii,ci){
  currentImgIdx=ii;
  document.querySelectorAll('#thumbsRow .thumb').forEach((t,i)=>t.classList.toggle('active',i===ii));
  setMainImg(PRODUCTS[productId].colors[ci].imgs[ii]);
}

function slideImg(dir){
  const imgs=PRODUCTS[productId].colors[currentColor].imgs;
  currentImgIdx=(currentImgIdx+dir+imgs.length)%imgs.length;
  selectThumb(currentImgIdx,currentColor);
}

function setMainImg(src){
  const img=document.getElementById('mainImg');
  const ph=document.getElementById('gPh');
  img.src=src;
  img.onerror=function(){this.style.display='none';ph.style.display='flex'};
  img.onload=function(){this.style.display='block';ph.style.display='none'};
}

function buildDesc(){
  const prod=PRODUCTS[productId];
  const d=prod.desc[currentLang]||prod.desc.ar;
  let html='';
  d.p.forEach(p=>{html+=`<p class="desc-text">${p}</p>`});
  html+='<div class="feat-list">';
  d.feats.forEach(f=>{html+=`<p>${f}</p>`});
  html+='</div>';
  document.getElementById('descContent').innerHTML=html;
}

function buildFaq(){
  const prod=PRODUCTS[productId];
  const d=prod.desc[currentLang]||prod.desc.ar;
  let html='';
  d.faq.forEach(item=>{
    html+=`<div class="faq-item">
      <div class="faq-q">${item.q}</div>
      <div class="faq-a">${item.a}</div>
    </div>`;
  });
  document.getElementById('faqContent').innerHTML=html;
}

function updateOrderLinks(ci){
  const prod=PRODUCTS[productId];
  const c=prod.colors[ci];
  const name=prod.name[currentLang]||prod.name.ar;
  const col=c[currentLang]||c.ar;
  const msg=currentLang==='ar'
    ?`السلام عليكم، بغيت نطلب ${name} بلون ${col} (${prod.price} درهم)`
    :`Bonjour, je veux commander ${name} en couleur ${col} (${prod.price} Dh)`;
  const url='https://wa.me/212771263305?text='+encodeURIComponent(msg);
  document.getElementById('orderBtn').href=url;
  document.getElementById('stickyOrder').querySelector('a').href=url;
}

function shareProduct(){
  if(navigator.share){
    navigator.share({title:document.title,url:location.href});
  } else {
    navigator.clipboard.writeText(location.href).then(()=>{
      alert(currentLang==='ar'?'تم نسخ الرابط!':'Lien copié !');
    });
  }
}

/* ═══ LANG ═══ */
function applyLang(lang){
  currentLang=lang;
  localStorage.setItem('lang',lang);
  const html=document.documentElement;
  html.lang=lang;html.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n;
    if(T[lang]&&T[lang][k]!==undefined) el.textContent=T[lang][k];
  });
  const btn=document.getElementById('langBtn');
  if(btn) btn.textContent=lang==='ar'?'🇫🇷 FR':'🇲🇦 AR';
  // back arrow direction
  const backIcon=document.querySelector('.back-btn i');
  if(backIcon) backIcon.className='fa-solid '+(lang==='ar'?'fa-arrow-right':'fa-arrow-left');
  // rebuild content
  buildPage();
}
function toggleLang(){applyLang(currentLang==='ar'?'fr':'ar');}

init();
</script>
